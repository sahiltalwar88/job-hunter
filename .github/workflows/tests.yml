name: Tests

on:
  push:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "util/**"
      - "conftest.py"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "util/**"
      - "conftest.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      - name: Run tests
        env:
          JOB_SCRAPER_DIR: ${{ github.workspace }}
        run: pytest -v
