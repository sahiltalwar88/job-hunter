<meta charset="utf-8">
<title>job-hunter Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<div id="app">
  <div id="top">
    <div id="stats" style="display:flex;min-width:0;flex:1"></div>
    <div id="controls">
      <button class="ctl" id="btnBack">◂ Back</button>
      <button class="ctl primary" id="btnNext">Next ▸</button>
      <button class="ctl" id="btnFlow">‖ Pause</button>
      <button class="ctl" id="btnStep">Trace one step</button>
      <button class="ctl" id="btnReset">Refit</button>
    </div>
  </div>
  <div id="main">
    <nav id="index" aria-label="Structures"></nav>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
          <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="rail"></div>
      <div id="flowSel"></div>
      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>
    </div>
    <aside id="panel">
      <div id="tabs">
        <button data-tab="what" class="on">What it does</button>
        <button data-tab="how">How it's built</button>
        <button data-tab="cond">Open questions</button>
      </div>
      <div id="body"></div>
    </aside>
  </div>
  <div id="hint">
    <span>enter / ] next chapter</span><span>[ back</span><span>hover to read</span><span>click to pin</span><span>→ go inside</span><span>← come out</span><span>click a dot to inspect its packet</span>
  </div>
</div>

<script>
const GROUPS = [{"id":"ext","title":"External"},{"id":"prep","title":"Prep"},{"id":"disc","title":"Discovery"},{"id":"refs","title":"Reference pool"},{"id":"grade","title":"JD grading"},{"id":"triage","title":"Triage"},{"id":"custom","title":"Customization"},{"id":"gates","title":"Quality gates"},{"id":"out","title":"Output"},{"id":"defer","title":"Not yet switched on"}];
const NODES = [{"id":"JS","code":"JS","name":"Job Scraper","short":"SCRAPER","group":"ext","gx":0,"gy":0,"w":3,"d":2,"h":30,"kind":"slab","one":"The adjacent repo that feeds raw job listings.","what":"A GitHub Actions pipeline that scrapes LinkedIn job postings on an hourly schedule and commits them to a rolling master file.","how":"<code>../job-scraper/scrape_jobs.py</code> → <code>output/all_jobs.json</code> (3.9MB+, 7-day rolling window). Read-only from job-hunter's perspective.","steps":[["Scrape","Hourly GitHub Actions workflow pulls new LinkedIn postings."],["Dedup","Jobs deduped by URL across search terms and geos."],["Commit","Results committed to all_jobs.json."]],"cond":[]},{"id":"ST","code":"ST","name":"Systemd Timer","short":"TIMER","group":"ext","gx":0,"gy":4,"w":2,"d":2,"h":28,"kind":"job","one":"The hourly heartbeat that kicks off the pipeline.","what":"A systemd user timer that triggers the pipeline service every hour with boot catch-up.","how":"<code>job-hunter-pipeline.timer</code> → <code>job-hunter-pipeline.service</code>. <mark>Hourly</mark> with <code>Persistent=true</code> for boot catch-up.","steps":[["Tick","Timer fires every hour."],["Launch","Starts <code>pipeline/__main__.py</code> as a service."]],"cond":[]},{"id":"OR","code":"OR","name":"Orchestrator","short":"ORCHESTRATOR","group":"prep","gx":4,"gy":1,"w":3,"d":3,"h":72,"kind":"tall","one":"The brain — a LangGraph StateGraph that runs the per-job pipeline, with a plain-function prep phase.","what":"The control plane: prep phase (feasibility, fetch, discover) runs as plain functions, then a per-job LangGraph StateGraph handles ingest, grading, customization, optimization loops, truthfulness, and routing. Each job runs as a separate graph invocation with SqliteSaver checkpointing for resumability. It invokes LLMs for cognitive tasks and handles all plumbing itself.","how":"<code>pipeline/__main__.py</code> + <code>pipeline/</code> package. Acquires a file lock, loads config from <code>config.json</code>, runs prep functions, invokes the per-job graph for each new job. Graph nodes use the configured Devin, Codex, or Claude CLI adapter through <code>pipeline/infrastructure/llm_interface.py</code>. Commits and pushes at the end.","steps":[["Lock","Acquire <code>.devin/pipeline.lock</code> to prevent concurrent runs."],["Config","Load thresholds, timeouts, model names from config.json."],["Prep 1-2","Feasibility check + fetch JDs (plain functions)."],["Prep 3","Discover + dedup new jobs (plain function)."],["Per-job graph","For each new job: ingest → grade JD → triage → [customize → grade resume → veracity → should_continue] loop → final veracity gate → finalize → stages/4_ready/stages/6_rejected."],["Checkpoint","SqliteSaver at <code>data/jobs.db</code> — interrupted runs resume per job."],["Finish","Commit, push, notify, release lock."]],"cond":[{"q":"Should optimization iterations run in parallel for multiple jobs?","r":"No — sequential is safer and cost is bounded by max_optimization_iterations (2026-08-24)."}]},{"id":"ES","code":"ES","name":"Enrichment Sidecar","short":"SIDECAR","group":"prep","gx":2,"gy":5,"w":3,"d":3,"h":36,"kind":"store","one":"A SQLite database that stores pipeline enrichments separate from the scraper's output.","what":"Holds feasibility tags and JD descriptions so the scraper's all_jobs.json stays read-only. Replaces the old architecture where enrichments were written directly to all_jobs.json (and lost on every scraper update).","how":"<code>data/enrichments.db</code>. Managed by <code>pipeline/infrastructure/enrichment_store.py</code>. Gitignored — regenerable from scraper data + LLM/HTTP fetches.","steps":[["Write feasibility","<code>store.set_feasibility(url, feasible, tier, ...)</code>"],["Write JD","<code>store.set_description(url, text)</code>"],["Read","<code>store.merge_into_jobs(jobs)</code> merges sidecar data into job list."]],"cond":[]},{"id":"FC","code":"FC","name":"Feasibility Checker","short":"FEASIBILITY","group":"prep","gx":5,"gy":5,"w":2,"d":2,"h":20,"kind":"cards","one":"LLM task 1 — tags each job as preferred, yes, or no.","what":"An LLM that receives job metadata (title, company, location) and returns a tripartite verdict: \"preferred\" (Big Tech / top-tier fit), \"yes\" (fits but not Big Tech), or \"no\" (doesn't fit).","how":"<code>pipeline/infrastructure/feasibility_checker.py</code> (ported from scraper). Uses <code>LLMFeasibilityChecker</code> with the configured provider and customizer model. Prompt in <code>config.json</code> → <code>feasibility_prompt</code>. Verdicts stored in the sidecar.","steps":[["Batch","Load unchecked jobs from sidecar."],["Call LLM","Send job metadata to customizer-model in batches."],["Parse","Extract tier verdict (preferred/yes/no)."],["Store","Write feasible + feasibility fields to sidecar."]],"cond":[]},{"id":"JF","code":"JF","name":"JD Fetcher","short":"JD FETCH","group":"prep","gx":7,"gy":4,"w":2,"d":2,"h":20,"kind":"box","one":"Fetches JD descriptions from LinkedIn for feasible jobs.","what":"A code step that fetches full JD text for feasible jobs that don't already have descriptions. The backfill scraper saves title/company/location/URL only — no JD text.","how":"<code>pipeline/helpers/fetch_jds.py</code>. Reuses scraper's <code>fetch()</code> with built-in exponential backoff for LinkedIn 429s (30s × 2^attempt, up to 4 retries). Writes to the sidecar, not all_jobs.json.","steps":[["Find gaps","Query feasible jobs missing descriptions."],["Fetch","HTTP GET each JD URL with backoff."],["Store","Write description text to sidecar incrementally (crash-safe)."]],"cond":[]},{"id":"CF","code":"CF","name":"Clearance Detection","short":"CLEARANCE","group":"disc","gx":9,"gy":3,"w":2,"d":2,"h":28,"kind":"gate","one":"LLM-only detection — auto-rejects clearance-required jobs during JD grading.","what":"If a JD requires security clearance (active, eligible, TS/SCI, secret, ability to obtain, etc.), the JD grader LLM returns <code>CLEARANCE</code> instead of a grade. The conditional edge routes it to trash. No regex filter (ADR-0007).","how":"LLM-only — the JD grading prompt instructs the LLM to return <code>CLEARANCE</code> if the job requires clearance. The graph's <code>route_after_jd_grade</code> checks <code>state.jd_grade.is_clearance</code> and routes to the trash node.","steps":[["Grade JD","LLM receives JD text."],["Detect","If clearance required → returns <code>CLEARANCE</code> instead of a grade."],["Reject","Graph routes to <code>stages/7_stages/7_trash/trash/&lt;lt;company-role&gt;/</code>."]],"cond":[]},{"id":"LI","code":"LI","name":"Listings","short":"LISTINGS","group":"disc","gx":10,"gy":5,"w":2,"d":2,"h":16,"kind":"screen","one":"The folder where JD files await grading.","what":"Each new feasible job gets a folder <code>stages/1_stages/1_listings/listings/&lt;lt;company-role&gt;/</code> with a <code>[TBD] job-description.md</code> file. After grading, the file is renamed to <code>[score] job-description.md</code>.","how":"Filesystem. One folder per job listing. <code>[TBD]</code> prefix = ungraded, <code>[score]</code> prefix = graded.","steps":[["Ingest","Create folder + [TBD] JD file for each new feasible job."],["Grade","JD grader renames [TBD] → [score]."],["Route","Triage moves the folder to stages/7_trash/, rejected/, or drafts/."]],"cond":[]},{"id":"BR","code":"BR","name":"Base Resume","short":"BASE RESUME","group":"refs","gx":8,"gy":8,"w":2,"d":2,"h":20,"kind":"box","one":"The generic resume — the only customization base.","what":"Every tailored resume starts from this template. The orchestrator pre-copies it to <code>stages/2_stages/2_drafts/drafts/&lt;lt;slug&gt;/[TBD] resume-v1.md</code> before the customizer runs. The customizer edits the copy in place. Also the primary JD grading reference.","how":"<code>_config/_config/profile/base-resume/base-resume.md</code>. Root-owned, immutable. 70 rendered lines.","steps":[],"cond":[]},{"id":"LE","code":"LE","name":"LinkedIn Experience","short":"LINKEDIN","group":"refs","gx":10,"gy":8,"w":2,"d":2,"h":20,"kind":"box","one":"The full LinkedIn career history — the sourcing reference.","what":"Consulted during JD grading (to know what's available) and customization (to pull in experience not on the base resume). Never used as a customization base. Truthfulness review verifies against this.","how":"<code>_config/_config/profile/full-experience/full-experience.md</code>. Root-owned, immutable.","steps":[],"cond":[]},{"id":"CG","code":"CG","name":"Customization Protocol","short":"PROTOCOL","group":"refs","gx":9,"gy":10,"w":2,"d":2,"h":20,"kind":"box","one":"The rules for customizing a resume — the single source of truth for the customizer.","what":"Defines formatting, ordering, truthfulness, strategy rules, line budget (target 70, ceiling 75), and the self-measurement instruction. The customizer follows it strictly.","how":"<code>_config/resume-customization-protocol.md</code>. The single source of truth for customization rules — line budget, self-measurement, reference pool semantics, formatting, truthfulness constraints.","steps":[],"cond":[{"q":"Should the guide move to _config/ with the grading and veracity protocols?","r":"Yes — agreed during grilling session (2026-08-24). Deferred to a separate task."}]},{"id":"JG","code":"JG","name":"JD Grader","short":"JD GRADER","group":"grade","gx":12,"gy":3,"w":2,"d":2,"h":20,"kind":"cards","one":"LLM task 2 — grades a JD against the candidate profile.","what":"Receives JD text, reads the base resume and full career history, and returns a grade (0-10) with justification. The orchestrator parses the text output and does the rename/triage.","how":"customizer-model via the configured LLM CLI. Prompt: <code>build_jd_grading_prompt()</code> in <code>pipeline/step4_grade_jd.py</code>. Outputs <code>GRADE: N\\nJUSTIFICATION: ...</code> or <code>CLEARANCE</code> to stdout. Code parses and renames.","steps":[["Read profile","Read base resume + full career history."],["Grade","Assess fit: experience match, realistic obtainability, gap analysis."],["Output","Return GRADE: N + JUSTIFICATION to stdout."]],"cond":[]},{"id":"TL","code":"TL","name":"Triage Logic","short":"TRIAGE","group":"triage","gx":14,"gy":2,"w":2,"d":2,"h":28,"kind":"gate","one":"Routes JDs by grade: trash, rejected, or drafts.","what":"Code that moves the listing folder based on the JD grade. Grade &lt; 6 → trash. Grade 6-7.9 → rejected. Grade ≥ 8 → drafts (proceed to customization).","how":"<code>step5_triage_node()</code> in <code>pipeline/step5_triage.py</code>. Threshold from <code>config.jd_grade_threshold</code> (default 8). Uses <code>move_dir()</code> to relocate folders.","steps":[["Check grade","Compare JD grade against thresholds."],["Route","&lt;6 → stages/7_trash/, 6-7.9 → stages/6_rejected/[JOB-FIT], ≥8 → stages/2_drafts/"]],"cond":[]},{"id":"TR","code":"TR","name":"Trash","short":"TRASH","group":"triage","gx":15,"gy":0,"w":2,"d":2,"h":16,"kind":"screen","one":"Auto-rejected jobs — clearance-required or JD grade &lt; 6.","what":"Skimmable but periodically emptied. Two triggers: LLM detected a clearance requirement during JD grading, or JD grade below 6.","how":"Filesystem: <code>stages/7_stages/7_trash/trash/&lt;lt;company-role&gt;/</code>. Periodically deleted by the user.","steps":[],"cond":[]},{"id":"RJ","code":"RJ","name":"Rejected","short":"REJECTED","group":"triage","gx":15,"gy":5,"w":2,"d":2,"h":16,"kind":"screen","one":"Abandoned listings — weak fit or no passing resume version.","what":"Two subfolder types: <code>[JOB-FIT]</code> (JD grade 6-7.9, weak overall fit) and <code>[RESUME]</code> (no version passed grade ≥ 9 + veracity after the customize loop). Kept for reference.","how":"Filesystem: <code>stages/6_rejected/[JOB-FIT] &lt;company-role&gt;/</code> or <code>stages/6_rejected/[RESUME] &lt;company-role&gt;/</code>.","steps":[],"cond":[]},{"id":"CU","code":"CU","name":"Customizer","short":"CUSTOMIZER","group":"custom","gx":17,"gy":3,"w":2,"d":2,"h":20,"kind":"cards","one":"LLM task 3 — edits a pre-copied resume from the reference pool to optimally match the JD.","what":"The orchestrator pre-copies a starting draft to <code>stages/2_drafts/&lt;slug&gt;/[TBD] resume-vN.md</code> — the base resume for v1, the previous version for v2+. The customizer edits it in place — pulling relevant experience from LinkedIn, rephrasing, condensing, reordering. Self-measures with count_lines and self-trims if over 75 rendered lines. One agent handles both first drafts and revisions (a revision carries grader + veracity feedback), and ends every call with a YES/NO on whether further truthful improvement is possible — the loop's stopping signal (ADR-0018). The JD grade is passed to the first customization prompt.","how":"customizer-model via the configured LLM CLI (automated) or custom subagent profile <code>util/agent-profiles/customizer.md</code> (Devin debug mode). Prompt: <code>build_customize_prompt()</code>. Follows the customization protocol strictly. Runs <code>count_lines</code> via exec for self-measurement.","steps":[["Read inputs","Pre-copied base resume + protocol + LinkedIn + JD + JD grade + few-shot examples."],["Customize","Edit the pre-copied resume in place. Draw from the reference pool to optimally match the JD. Rephrase, condense, reorder, pull — all valid."],["Self-measure","Run <code>python3 -m pipeline.helpers.count_lines --json</code> on the output."],["Self-trim","If &gt; 75 rendered lines, trim least JD-relevant bullets. Up to 3 passes."]],"cond":[{"q":"What happens if count_lines reports >75 after 3 trim passes?","r":"Accept and proceed — the grader is the quality gate, not the line count (2026-08-24)."}]},{"id":"CL","code":"CL","name":"count_lines","short":"LINE CTR","group":"custom","gx":18,"gy":5,"w":2,"d":2,"h":18,"kind":"box","one":"A script that measures rendered line count — the customizer's only exec tool.","what":"Takes a resume markdown file and outputs per-bullet character count, rendered line count, widow flags (diagnostic only), total rendered lines, and total bullet count. The customizer runs it during its own turn to self-measure and self-trim.","how":"<code>pipeline/helpers/count_lines</code>. Human-readable default, <code>--json</code> for machine-readable. <code>--wrap-chars</code> CLI arg (default 102). Detects <code>* </code> bullet syntax with trailing two-space line breaks stripped.","steps":[["Parse","Extract bullets from markdown (lines starting with <code>* </code>)."],["Count","Per-bullet char count → ceil(chars/102) rendered lines."],["Flag","Widow flags for 103-115 and 205-217 ranges (diagnostic only)."],["Output","Total rendered lines + per-bullet breakdown."]],"cond":[]},{"id":"DR","code":"DR","name":"Drafts","short":"DRAFTS","group":"custom","gx":17,"gy":7,"w":2,"d":2,"h":16,"kind":"screen","one":"The folder where resumes go through the customization and grading loop.","what":"Each job gets a folder <code>stages/2_drafts/&lt;company-role&gt;/</code> with <code>[TBD] resume-vN.md</code> files. After grading, renamed to <code>[score] resume-vN.md</code>. The customize-grade-veracity loop iterates here until the customizer says no further truthful improvement is possible or the version budget is exhausted.","how":"Filesystem. <code>[TBD]</code> = ungraded, <code>[score]</code> = graded. Version numbers increment in the loop (v1, v2, v3...); only the best passing version ships to stages/4_ready/.","steps":[],"cond":[]},{"id":"RG","code":"RG","name":"Resume Grader","short":"RES GRADER","group":"gates","gx":20,"gy":3,"w":2,"d":2,"h":20,"kind":"cards","one":"LLM task 4 — grades a customized resume against the JD with realistic recruiter framing.","what":"Reads the grading protocol, resume, and JD. Grades in a single pass, writes JSON to .grading/, renames the resume file from [TBD] to [score], and appends to .grades.log. Be realistically harsh — as harsh as a recruiter taking 30 seconds to skim.","how":"grader-model via eviews and submits manually. Not yet implemented.","how":"Planned: <code>stages/3_in-progress/in-progress/&lt;lt;company-role&gt;/</code>. Semi-automated co-work with the user.","steps":[["Navigate","Go to job posting URL."],["Fill","Fill in application fields."],["Stop","Get to last page and STOP — do not submit."]],"cond":["When will form-filling be implemented?"]},{"id":"SU","code":"SU","name":"Submission","short":"SUBMIT","group":"defer","ghost":true,"gx":27,"gy":7,"w":2,"d":2,"h":16,"kind":"screen","one":"Deferred — the user's manual record of submitted applications.","what":"After the user reviews and submits an application, they record it here. The agent never writes to this folder — it is the user's manual record only.","how":"Planned: <code>stages/5_submitted/submitted/&lt;lt;company-role&gt;/</code>. Manual step — agent never writes here.","steps":[],"cond":[]}];

const CH = [{"id":"feed","title":"The feed","reveal":["JS","OR","ST"],"lede":"Strip everything away and this is the heartbeat: a scraper feeds jobs, a timer kicks the orchestrator every hour.","story":"<p>The <mark>orchestrator</mark> is the brain — a Python script that owns all state and sequences every step. It does not think; it calls LLMs for that. The scraper is an adjacent repo, read-only from here.</p>","flow":[["ST","OR","hourly tick",{"trigger":"systemd timer"}],["JS","OR","raw jobs",{"source":"all_jobs.json"}]]},{"id":"feasible","title":"Is it feasible?","reveal":["ES","FC"],"lede":"Before doing anything, the orchestrator tags each job: is this a role the candidate could plausibly get?","story":"<p>The <mark>feasibility checker</mark> is the first LLM task — it receives job metadata (title, company, location) and returns a tripartite verdict. Verdicts go to the sidecar, not back to the scraper's file.</p>","flow":[["OR","FC","unchecked jobs",{"batch":10}],["FC","ES","verdicts",{"tier":"preferred|yes|no"}]]},{"id":"fetchjd","title":"Getting the JD","reveal":["JF","CF"],"lede":"The scraper saves titles only. The orchestrator fetches full JD text. Clearance is detected by the LLM during JD grading — no regex filter.","story":"<p><mark>Clearance-required jobs go to trash</mark> — the JD grader LLM returns <code>CLEARANCE</code> instead of a grade, and the graph routes to trash. No regex filter (ADR-0007). The JD fetcher has built-in backoff for LinkedIn rate-limiting.</p>","flow":[["OR","JF","feasible jobs",{}],["JF","ES","JD text",{"backoff":"30s×2^n"}],["JG","CF","CLEARANCE?",{"check":"LLM"}],["CF","TR","clearance → trash",{"reason":"TS/SCI"}]]},{"id":"worthit","title":"Is it worth applying?","reveal":["JG","BR","LE"],"lede":"The JD grader reads the candidate's profile and returns a score. The base resume and full career history are the reference material.","story":"<p>The <mark>JD grader</mark> is LLM task 2. It reads both the base resume (what's on the generic resume) and the full career history (what's available but not surfaced). The grade reflects what the candidate could bring, not just what's currently on the base.</p>","flow":[["OR","JG","JD text",{"slug":"..."}],["JG","BR","read profile",{}],["JG","LE","read LinkedIn",{}],["JG","OR","GRADE: 8.5",{"grade":8.5}]]},{"id":"sort","title":"Sorting the pile","reveal":["TL","TR","RJ"],"lede":"The orchestrator routes by grade: trash, rejected, or drafts. Only ≥ 8 proceeds to customization.","story":"<p>Grade &lt; 6 → <mark>trash</mark>. Grade 6-7.9 → <mark>rejected</mark> (weak fit). Grade ≥ 8 → drafts (worth customizing a resume). The triage is pure code — no LLM involved.</p>","flow":[["JG","TL","grade",{"score":8.5}],["TL","RJ","6-7.9 → rejected",{}],["TL","DR","≥8 → drafts",{}]]},{"id":"pool","title":"The reference pool","reveal":["CG","DR"],"lede":"Three documents form the pool the customizer draws from. The drafts folder is where the work happens.","story":"<p>The <mark>base resume is the only customization base</mark> — every tailored resume starts from it. The full career history supplies material not on the base. The customization protocol is the rulebook. The customizer treats all three as a reference pool to optimally match the JD.</p>","flow":[]},{"id":"write","title":"Customizing the resume","reveal":["CU","CL"],"lede":"The orchestrator pre-copies the base resume. The customizer edits it in place, measures with count_lines, and self-trims if over 75 lines.","story":"<p>The <mark>customizer</mark> is LLM task 3 — one agent for both first drafts and revisions (ADR-0018; a revision carries grader + veracity feedback). The orchestrator pre-copies the starting draft to <code>[TBD] resume-vN.md</code> and passes the JD grade. The customizer edits the copy in place — no recreating from scratch. It runs <code>count_lines</code> during its own turn to self-measure, keeping full context for smarter trim decisions. After editing it answers YES/NO: could this be truthfully improved further? That answer is the loop's stopping signal.</p>","flow":[["OR","DR","pre-copy base",{"file":"[TBD] resume-v1.md"}],["OR","CU","customize (edit in place)",{"slug":"...","jdGrade":8.5}],["CU","CL","measure",{"cmd":"count_lines --json"}],["CL","CU","72 lines",{"total":72,"ceiling":75}]]},{"id":"resgrade","title":"Grading the resume","reveal":["RG","GL"],"lede":"A separate agent grades the resume with realistic recruiter harshness. It owns the score rename.","story":"<p>The <mark>resume grader</mark> is LLM task 4, running on grader-model for independent evaluation. It grades in a single pass, writes JSON, renames the file from [TBD] to [score], and appends to the audit log. The customizer never grades — that's the grader's job.</p>","flow":[["OR","RG","grade prompt",{"version":"v1"}],["RG","DR","rename",{"from":"[TBD]","to":"[9.0]"}],["RG","GL","append log",{"entry":"grade=9.0"}]]},{"id":"truth","title":"Is it true?","reveal":["TV","HK"],"lede":"A truthfulness verifier checks every claim against the LinkedIn superset. Hooks enforce integrity throughout.","story":"<p>The <mark>truthfulness reviewer</mark> is LLM task 5 — runs inside the loop on every version grading ≥ 9, and once more as the final gate on the selected version before it ships (with fallback to the next-best candidate). The <mark>hooks</mark> are the hard guarantees: no score tampering, no unapproved exec, no completion with failing grades. Together they ensure the resume is both good (≥9) and honest.</p>","flow":[["OR","TV","verify",{"slug":"..."}],["TV","BR","read base",{}],["TV","LE","read LinkedIn",{}],["TV","OR","VERIFIED",{"result":"all claims verified"}]]},{"id":"done","title":"Done","reveal":["RD","NO"],"lede":"Passing resumes land in stages/4_ready/. The user gets a push notification.","story":"<p>A resume moves to <mark>stages/4_ready/</mark> only if grade ≥ 9 AND it survived the final truthfulness gate — the selected version is re-verified after the loop, with fallback to const HOW_HTML = "<div class=\"eyebrow\">job-hunter · v1</div><h1 class=\"t\">How it's built</h1><div class=\"sub\">the shape and what sits around it</div>\n<h3 class=\"sec\">Architecture</h3>\n<p>Code orchestrates, LLMs cognate. <code>pipeline/__main__.py</code> + the <code>pipeline/</code> package handle all plumbing (file I/O, HTTP fetching, state management, routing) via Python. A LangGraph StateGraph runs the per-job pipeline with conditional edges and a customize-grade-veracity cycle. LLM agents are invoked through the configured Devin, Codex, or Claude CLI for 5 cognitive tasks only: feasibility checking, JD grading, resume customization, resume grading, and truthfulness verification.</p>\n<h3 class=\"sec\">Filesystem</h3>\n<pre>job-hunter/\n  pipeline/           # pipeline package (infrastructure, steps, helpers)\n  _config/          # grading/veracity protocols, glossary\n  _config/profile/          # base resume, LinkedIn, customization protocol\n  .devin/           # pipeline config, hooks, subagent profiles\n  stages/1_listings/ # JDs awaiting grading\n  stages/2_drafts/   # resumes in optimization loop\n  stages/4_ready/    # passing resumes awaiting application\n  stages/6_rejected/  # abandoned listings\n  stages/7_trash/     # auto-rejected jobs\n  data/             # enrichment sidecar (SQLite)\n  docs/             # ADRs + this atlas</pre>\n<h3 class=\"sec\">Models</h3>\n<p><b>customizer-model</b> — feasibility checking, JD grading, resume customization (the \"doing\" tasks). <b>grader-model</b> — resume grading, truthfulness verification (the \"judging\" tasks, isolated for independence).</p>";

const TW=72, TH=36;

function pts(a){ return a.map(p=>p.join(',')).join(' '); }

const isNew=id=>S.ch<CH.length-1 && CH[S.ch].reveal.includes(id);

/* ---------------- SCENES ---------------- */
function buildWorldScene(){
  const ids=new Set(revealedIds()); sceneNodes=NODES.filter(n=>ids.has(n.id)); sceneHops=[];
  const c=CH[S.ch];
  if(c.flow){ c.flow.forEach((h,i)=>{ let bend=bendFor(h[0],h[1]); const rev=c.flow.findIndex(x=>x[0]===h[1]&&x[1]===h[0]); if(rev>-1&&rev<i) bend=bend==='xy'?'yx':'xy'; sceneHops.push({flow:'ch',idx:i,from:h[0],to:h[1],label:h[2],payload:h[3],bend}); }); }
  else { FLOWS.forEach(f=>{ if(S.flowSel!=='both'&&f.id!==S.flowSel)return; f.hops.forEach((h,i)=>sceneHops.push({flow:f.id,idx:i,from:h[0],to:h[1],label:h[2],payload:h[3],bend:h[4]||'xy'})); }); }
}
function bendFor(a,b){ const t=FLOWS[0].hops.find(h=>h[0]===a&&h[1]===b)||FLOWS[1].hops.find(h=>h[0]===a&&h[1]===b); return t?(t[4]||'xy'):'yx'; }
function buildInsideScene(n){
  const steps=n.steps||[]; sceneNodes=steps.map((s,i)=>({id:'s'+i,code:String(i+1),name:s[0],short:s[0],desc:s[1],gx:2+i*3.4,gy:2+i*0.6,w:2,d:2,h:34,inside:true}));
  sceneHops=[]; for(let i=0;i<steps.length-1;i++) sceneHops.push({flow:'inside',idx:i,from:'s'+i,to:'s'+(i+1),label:steps[i][0]+' → '+steps[i+1][0],payload:{step:i+1,handsOff:steps[i+1][0]},bend:'xy'});
}
function hopPath(h){
  const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); if(!A||!B) return null;
  const [ax,ay]=center(A), [bx,by]=center(B); const mid = h.bend==='xy' ? [bx,ay] : [ax,by];
  const g=[[ax,ay],mid,[bx,by]].filter((p,i,arr)=>i===0||p[0]!==arr[i-1][0]||p[1]!==arr[i-1][1]);
  const scr=g.map(p=>P(p[0],p[1],0)); let len=0; const seg=[]; for(let i=1;i<scr.length;i++){const l=Math.hypot(scr[i][0]-scr[i-1][0],scr[i][1]-scr[i-1][1]);seg.push(l);len+=l;}
  return {grid:g,scr,seg,len};
}
function pointAt(path,t){ let d=t*path.len; for(let i=0;i<path.seg.length;i++){ if(d<=path.seg[i]||i===path.seg.length-1){const u=path.seg[i]?Math.min(1,d/path.seg[i]):1;const a=path.scr[i],b=path.scr[i+1];return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];} d-=path.seg[i]; } return path.scr[0]; }

/* ---------------- RENDER ---------------- */

  world.appendChild(gg);
  if(S.view==='world'&&S.ch>=CH.length-1){
    const plate=(x0,y0,x1,y1,dash)=>{const p=el('polygon',{points:pts([P(x0,y0),P(x1,y0),P(x1,y1),P(x0,y1)]),fill:'none',stroke:'var(--ink)','stroke-width':.9,opacity:.5});if(dash)p.setAttribute('stroke-dasharray','5 4');return p;};
    world.appendChild(plate(0.5,1.5,17,10.5,false)); world.appendChild(plate(2,9,17.5,16.5,false)); world.appendChild(plate(-2,-2,24,17.5,true));
  }

    const pl=el('polyline',{points:pts(h.path.scr),fill:'none',stroke:'var(--ink)','stroke-width':h.flow!=='turn'&&h.flow!=='ch'&&h.flow!=='inside'?1:1.4,opacity:(h.flow!=='turn'&&h.flow!=='ch'&&h.flow!=='inside')||ghost?.7:1});
    if((h.flow!=='turn'&&h.flow!=='ch'&&h.flow!=='inside')||ghost)pl.setAttribute('stroke-dasharray','3 3'); hg.appendChild(pl);
    h.path.scr.slice(1,-1).forEach(p=>hg.appendChild(el('polygon',{points:pts([[p[0],p[1]-3.5],[p[0]+3.5,p[1]],[p[0],p[1]+3.5],[p[0]-3.5,p[1]]]),fill:'var(--ink)'})));
  });
  const ng=el('g'); world.appendChild(ng);
  [...sceneNodes].sort((a,b)=>(a.gx+a.gy+a.w+a.d)-(b.gx+b.gy+b.w+b.d)).forEach(n=>ng.appendChild(drawNode(n)));
  const lg=el('g'); world.appendChild(lg); sceneNodes.forEach(n=>lg.appendChild(drawLabel(n)));
  world.appendChild(el('g',{id:'pkts'})); drawPackets(); renderRail();
}
function drawLabel(n){

function drawNode(n){
  const g=el('g',{class:'node',style:'cursor:pointer','data-id':n.id});
  const {gx,gy,w,d,h}=n; const sel=S.selected===n.id, hov=S.hover===n.id, fresh=!n.inside&&isNew(n.id);
  const sw=sel?2:1.2, dash=n.ghost?'4 3':null, face=n.ghost?'none':'var(--face)';
  const face3=(p,fill,hatch,extra={})=>{const poly=el('polygon',{points:pts(p),fill:fill,stroke:'var(--ink)','stroke-width':sw,'stroke-linejoin':'round',...extra});if(dash)poly.setAttribute('stroke-dasharray',dash);g.appendChild(poly);if(hatch&&!n.ghost){g.appendChild(el('polygon',{points:pts(p),fill:'url(#'+hatch+')',style:'color:var(--ink)',stroke:'none'}));}};
  const box=(z0,z1,hatchTop)=>{ face3([P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,'hatch'); face3([P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)],face,'hatch'); face3([P(gx,gy,z1),P(gx+w,gy,z1),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,hatchTop||null); };
  const kind=n.kind||'box';
  if(kind==='store'){ const L=3, gap=3, lh=(h-gap*(L-1))/L; for(let i=0;i<L;i++){ const z0=i*(lh+gap); box(z0,z0+lh,null);} }
  else if(kind==='cards'){ const L=5, lh=h/L; for(let i=0;i<L;i++) box(i*lh,(i+1)*lh,null); }
  else if(kind==='slab'){ box(0,h,'hatchLight'); }
  else if(kind==='screen'){ box(0,h,null); const inset=.3; if(!n.ghost){ const scr=[P(gx+inset,gy+inset,h),P(gx+w-inset,gy+inset,h),P(gx+w-inset,gy+d-inset,h),P(gx+inset,gy+d-inset,h)]; g.appendChild(el('polygon',{points:pts(scr),fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.9})); for(let i=1;i<=3;i++){const a=P(gx+inset+.2,gy+inset+i*.4,h),b=P(gx+w-inset-.4-(i===3?.5:0),gy+inset+i*.4,h);g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.7}));} } }
  else if(kind==='gate'){ box(0,h,null); if(!n.ghost){ const z0=h*.55,z1=h*.75; const band=[[P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],[P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)]]; band.forEach(p=>g.appendChild(el('polygon',{points:pts(p),fill:'var(--ink)',opacity:.85,stroke:'none'}))); } }
  else if(kind==='tall'){ box(0,h,null); if(!n.ghost){ // roof ridge line on top to read as "the brain"
      const c=P(gx+w/2,gy+d/2,h); const a=P(gx,gy+d,h),b=P(gx+w,gy,h); g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.5})); } }
  else if(kind==='job'){ box(0,h,'hatchLight'); }
  else { box(0,h,null); }
  const top=[P(gx,gy,h),P(gx+w,gy,h),P(gx+w,gy+d,h),P(gx,gy+d,h)];
  if(sel||hov){ g.appendChild(el('polygon',{points:pts(top),fill:sel?'var(--ink)':'none',opacity:sel?.12:1,stroke:'var(--ink)','stroke-width':sel?2.5:1.8})); }
  if(fresh&&!sel){ g.appendChild(el('polygon',{class:'halo',points:pts([P(gx-.35,gy-.35,0),P(gx+w+.35,gy-.35,0),P(gx+w+.35,gy+d+.35,0),P(gx-.35,gy+d+.35,0)]),fill:'none',stroke:'var(--ink)','stroke-width':1.4,'stroke-dasharray':'4 3'})); }
  const c=P(gx+w/2,gy+d/2,h); const chipW=16;
  g.appendChild(el('rect',{x:c[0]-chipW/2,y:c[1]-8,width:chipW,height:14,fill:sel?'var(--hi-bg)':'var(--paper)',stroke:'var(--ink)','stroke-width':1}));
  const t=el('text',{x:c[0],y:c[1]+3,'text-anchor':'middle','font-size':'9','font-family':'var(--mono)',fill:sel?'var(--hi-fg)':'var(--ink)','font-weight':'600'}); t.textContent=n.code; g.appendChild(t);
  g.addEventListener('mouseenter',e=>{S.hover=n.id;showTip(e,n);renderPanel();render();});

/* ---------------- PACKETS ---------------- */
function initPackets(){ S.packets=[]; const flows=[...new Set(sceneHops.map(h=>h.flow))]; flows.forEach(f=>S.packets.push({flow:f,hop:0,t:0,speed:.5,pause:0})); S.selPacket=null; }
function hopsOf(flow){ return sceneHops.filter(h=>h.flow===flow); }
function drawPackets(){
  const pg=world.querySelector('#pkts'); if(!pg)return; pg.innerHTML='';
  S.packets.forEach((p,i)=>{ const hs=hopsOf(p.flow); const h=hs[p.hop]; if(!h||!h.path)return; const [x,y]=pointAt(h.path,p.t);
    const isSel=S.selPacket===i; const g=el('g',{class:'pkt',style:'cursor:pointer'});
    if(isSel) g.appendChild(el('circle',{cx:x,cy:y,r:11,fill:'none',stroke:'var(--ink)','stroke-width':1.2,'stroke-dasharray':'2 2'}));
    g.appendChild(el('circle',{cx:x,cy:y,r:5.5,fill:'var(--ink)',stroke:'var(--paper)','stroke-width':1.6}));
    if(isSel||S.hoverPacket===i||S.ch<CH.length-1){ const lbl=el('text',{x:x+10,y:y-8,'font-size':'10','font-family':'var(--mono)',fill:'var(--ink)','font-weight':'500'}); lbl.textContent=h.label; g.appendChild(el('rect',{x:x+7,y:y-19,width:h.label.length*6.4+6,height:14,fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.8})); g.appendChild(lbl); }
    g.addEventListener('click',e=>{e.stopPropagation();S.selPacket=i;S.playing=false;syncFlowBtn();renderPanel();drawPackets();});
    g.addEventListener('mouseenter',()=>{S.hoverPacket=i;drawPackets();});
    g.addEventListener('mouseleave',()=>{S.hoverPacket=null;drawPackets();});
    pg.appendChild(g);
  });
}
let last=0;
function tick(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; tweenTick(); if(S.playing){ S.packets.forEach(p=>advance(p,dt)); drawPackets(); if(S.selPacket!=null) renderPanel(); } requestAnimationFrame(tick); }
function advance(p,dt){ const hs=hopsOf(p.flow); if(!hs.length)return; if(p.pause>0){p.pause-=dt;return;} const h=hs[p.hop]; if(!h||!h.path){p.hop=(p.hop+1)%hs.length;return;} p.t+=dt*p.speed*(320/Math.max(120,h.path.len)); if(p.t>=1){p.t=0;p.hop=(p.hop+1)%hs.length;p.pause=(p.hop===0?1.2:.35);} }
function stepOnce(){ S.playing=false; syncFlowBtn(); let i=S.selPacket??0; const p=S.packets[i]; if(!p)return; const hs=hopsOf(p.flow); p.hop=(p.hop+1)%hs.length; p.t=.5; p.pause=0; S.selPacket=i; drawPackets(); renderPanel(); }
function syncFlowBtn(){ document.getElementById('btnFlow').textContent = S.playing?'‖ Pause':'▸ Play'; }
requestAnimationFrame(tick);

  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null; drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3){drag.moved=true;svg.classList.add('dragging');} S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ select(null); } drag=null; svg.classList.remove('dragging'); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
gotoCh(0);
</script>
